# TankLink report service. See README.md for setup.
name = "tanklink-reports"
main = "src/index.js"
compatibility_date = "2026-10-01"

# On our own domain so the backend can move later without an app update.
# tanklink.madhukartemba.in is the name apps use from 1.4.2 on.
# tanklink-reports. is built into apps 1.4.0 and 1.4.1: keep it until
# nobody runs those.
routes = [
  { pattern = "tanklink.madhukartemba.in", custom_domain = true },
  { pattern = "tanklink-reports.madhukartemba.in", custom_domain = true },
]
workers_dev = false

# The landing page at /. Routes the Worker handles itself (/app, /v1/*,
# /health) have no file here, so they still reach src/index.js.
[assets]
directory = "./public"

[vars]
GITHUB_REPO = "madhukartemba/tanklink-reports"
# Public repo whose release list GET /v1/releases serves (cached).
RELEASES_REPO = "madhukartemba/tanklink"

# Per-IP limit: 5 reports a minute. namespace_id is any number unique in
# your Cloudflare account.
[[ratelimits]]
name = "REPORT_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# All reports together: at most 20 a minute, whoever sends them.
[[ratelimits]]
name = "GLOBAL_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

# Secrets, set with `npx wrangler secret put <NAME>`: GITHUB_TOKEN, APP_KEY
